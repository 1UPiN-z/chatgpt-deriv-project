entialPayout">1.95 USD</div></div></div><div class="trade-buttons"><button class="btn buy" data-action="option-rise">↗ Rise</button><button class="btn sell" data-action="option-fall">↘ Fall</button></div><p class="notice">This is a simulated ticket. No real contract will be purchased. Possible outcomes and payouts are illustrative.</p></div><div class="section-head"><h2 class="section-title" style="font-size:20px">Open positions</h2><span class="eyebrow">${state.positions.length}</span></div>${state.positions.length?state.positions.slice(0,5).map(p=>`<div class="activity-row"><span class="activity-dot">${p.side==='Rise'?'↗':'↘'}</span><div class="grow"><strong>${p.side} · ${p.asset}</strong><small>${p.duration} · ${p.time}</small></div><b>${p.stake.toFixed(2)} USD</b></div>`).join(''):`<div class="soft-card muted" style="font-size:13px">No open demo positions.</div>`}</div>`;}
  function portfolio(){return `<div class="inner-head"><div class="inner-head-top"><div><div class="eyebrow" style="color:#9ca2aa">Your account</div><h1>Portfolio</h1><p>Balances, accounts and transactions</p></div><div class="head-actions"><button class="icon-btn" data-action="notifications">${ico('bell')}</button></div></div></div><div class="page-pad"><div class="soft-card" style="padding:20px"><div style="display:flex;align-items:center;justify-content:space-between"><span class="eyebrow">Total assets · ${state.mode}</span><button class="pill" data-action="balance">${ico('eye',15)} Hide</button></div><div style="font-size:31px;font-weight:780;letter-spacing:-.8px;margin-top:9px">0.00 <span style="font-size:14px;color:#777">USD</span></div><div class="muted small" style="margin-top:5px">Updated just now</div><div style="display:flex;gap:9px;margin-top:19px"><button class="btn" data-action="deposit">Deposit</button><button class="btn ghost" data-action="withdraw">Withdraw</button><button class="btn ghost" data-action="transfer">Transfer</button></div></div><div class="section-head"><h2 class="section-title" style="font-size:20px">Trading accounts</h2><div class="tabs" style="padding:0"><button class="tab ${state.mode==='Real'?'active':''}" data-mode="Real">Real</button><button class="tab ${state.mode==='Demo'?'active':''}" data-mode="Demo">Demo</button></div></div><div class="account-list"><div class="portfolio-account">${badgeLogo('options')}<div class="grow"><strong>Options</strong><small>USD · ${state.mode} account</small></div><b>0.00 USD</b></div><div class="portfolio-account">${badgeLogo('tv')}<div class="grow"><strong>TradingView</strong><small>CFDs · ${state.mode} account</small></div><b>0.00 USD</b></div><div class="portfolio-account">${badgeLogo('exchange')}<div class="grow"><strong>Deriv Exchange</strong><small>Crypto · ${state.mode} account</small></div><b>0.00 USD</b></div></div><div class="section-head"><h2 class="section-title" style="font-size:20px">Recent transactions</h2><button class="pill" data-action="all-transactions">View all</button></div><div class="activity-row"><span class="activity-dot">${ico('download',17)}</span><div class="grow"><strong>No transactions yet</strong><small>Deposits, withdrawals and transfers will appear here</small></div><span class="muted">—</span></div></div>`;}
  function more(){const items=[['Exchange','exchange'],['Options','options'],['TradingView','cfds'],['Swap-Free','cfds'],['P2P','p2p'],['Deriv Bot','bot'],['Deriv Trader','options'],['Deriv MT5','cfds'],['cTrader','cfds'],['Cashier','portfolio'],['Help centre','help'],['Settings','profile']];return `<div class="inner-head"><div class="inner-head-top"><div><div class="eyebrow" style="color:#9ca2aa">Explore</div><h1>More</h1><p>Products and account services</p></div><div class="head-actions"><button class="icon-btn" data-action="search">${ico('search')}</button></div></div></div><div class="page-pad"><div class="more-grid">${items.map(([name,target])=>`<button class="more-item" data-page="${target}"><span class="explore-icon">${name==='Deriv Bot'?ico('bot',30):name==='P2P'?'<b style="color:#f33;font-size:18px">P2P</b>':name==='Swap-Free'?'<b style="color:#0780bd">MT5</b>':name==='Deriv MT5'?'<b style="color:#0780bd">MT5</b>':name==='Cashier'?ico('wallet',29):name==='Help centre'?ico('help',29):name==='Settings'?ico('sliders',29):name==='TradingView'?'<b style="background:#050607;color:#fff;padding:9px;border-radius:9px">TV</b>':name==='Exchange'?'<b style="background:#111;color:#fff;padding:8px;border-radius:8px">DXN</b>':'<b style="background:#ff4058;color:#fff;padding:9px;border-radius:8px">↗</b>'}</span>${name}</button>`).join('')}</div><div class="soft-card" style="margin-top:27px"><strong>Demo workspace</strong><p class="muted" style="font-size:13px;line-height:1.5">Explore the interface using local sample data. This clone does not connect to Deriv or process payments.</p></div></div>`;}
  function bot(){return `<div class="bot-app"><div class="bot-topbar"><div class="bot-brand"><i>▣</i> deriv Bot</div><button data-action="bot-quick">Quick strategy</button><button data-action="bot-reset">↻</button><button data-action="bot-load">Open</button><button data-action="bot-save">Save</button><button data-action="bot-export">Export XML</button><button data-action="bot-run" class="run-bot">${state.botRunning?'Stop':'Run'}</button></div><div style="padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:16px">Bot builder</strong><div class="muted tiny" style="margin-top:4px">Build a strategy with connected blocks</div></div><span class="eyebrow">LOCAL DEMO</span></div><div class="bot-layout"><aside class="block-menu"><h3>Blocks menu</h3><input id="blockSearch" placeholder="Search blocks"/><div class="block-category">Set up your trade</div><button class="block-add" data-add-block="Trade parameters">+ Trade parameters</button><div class="block-category">Purchase contract</div><button class="block-add" data-add-block="Purchase conditions">+ Purchase conditions</button><div class="block-category">Sell contract</div><button class="block-add" data-add-block="Sell conditions">+ Sell conditions</button><div class="block-category">Trade again</div><button class="block-add" data-add-block="Restart trading conditions">+ Restart conditions</button><div class="block-category">Analysis</div><button class="block-add" data-add-block="Read market price">+ Read market price</button><button class="block-add" data-add-block="Compare values">+ Compare values</button><div class="block-category">Utility</div><button class="block-add" data-add-block="Set variable">+ Set variable</button><button class="block-add" data-add-block="Number / Math">+ Number / Math</button></aside><section class="workspace" id="botWorkspace"><div class="workspace-head"><strong>Workspace</strong><small>Drag blocks from menu or tap +</small></div><div class="block-stack" id="blockStack">${botBlocksMarkup()}</div></section></div><div class="bot-tabs"><button class="${state.botTab==='Workspace'?'active':''}" data-bot-tab="Workspace">Workspace</button><button class="${state.botTab==='Chart'?'active':''}" data-bot-tab="Chart">Chart</button><button data-bot-tab="Summary" class="${state.botTab==='Summary'?'active':''}">Summary</button></div>${state.botTab==='Chart'?`<div class="page-pad"><div class="chart-card"><strong>Volatility 100 Index</strong><div class="chart-value">17,492.36</div><div class="chart-change">+0.42%</div>${chartSvg()}</div></div>`:state.botTab==='Summary'?`<div class="page-pad"><div class="bot-stat-grid"><div class="bot-stat"><small>Total stake</small><b>0.00 USD</b></div><div class="bot-stat"><small>Total payout</small><b>0.00 USD</b></div><div class="bot-stat"><small>Runs</small><b>0</b></div><div class="bot-stat"><small>Profit / loss</small><b>0.00 USD</b></div></div></div>`:''}<div class="bot-status"><div><b>${state.botRunning?'Bot running in demo':'Bot is not running'}</b><br><span>${state.botRunning?'Simulated execution active':'Ready to run a local simulation'}</span></div><span>0 trades · 0.00 USD</span></div><div style="padding:10px 14px 17px;color:#858b93;font-size:10px;line-height:1.5">Deriv Bot-inspired visual builder. It saves strategies locally and runs only a simulation. No live API or trading account is connected.</div></div>`;}
  function botBlocksMarkup(){return state.botBlocks.map((b,i)=>`<div class="bot-block" draggable="true" data-block-index="${i}"><button class="block-remove" data-remove-block="${i}" aria-label="Remove block">×</button><h4>${i+1}. ${b}</h4>${b==='Trade parameters'?'<p>Market: <span class="block-input">Synthetic Indices</span> › <span class="block-input">Continuous Indices</span> › <span class="block-input">Volatility 100 Index</span></p><p>Trade type: <span class="block-input">Up/Down</span> › <span class="block-input">Rise/Fall</span></p><p>Contract type: <span class="block-input">Both</span></p><p>Default candle interval: <span class="block-input">1 minute</span></p><p>Trade options: Duration <span class="block-input">5</span> Minutes · Stake <span class="block-input">1 USD</span></p>':b==='Purchase conditions'?'<p>Purchase <span class="block-input">Rise</span></p><p>If market condition is met, buy contract</p>':b==='Sell conditions'?'<p>If <span class="block-input">Sell is available</span> then</p><p>Sell contract</p>':b==='Restart trading conditions'?'<p>Trade again when previous contract closes</p>':`<p>Configure ${b.toLowerCase()} parameters</p>`}</div>`).join('');}
  function pageMarkup(){switch(state.page){case'home':return home();case'cfds':return cfds();case'exchange':return exchange();case'options':return options();case'portfolio':return portfolio();case'more':return more();case'bot':return bot();case'p2p':return `<div class="inner-head"><h1>Deriv P2P</h1><p>Peer-to-peer transfers · demo view</p></div><div class="page-pad"><div class="soft-card">Buy and sell Deriv credits with other users. P2P orders are not connected in this demo.</div></div>`;case'help':return `<div class="inner-head"><h1>Help centre</h1><p>Guides and account support</p></div><div class="page-pad"><div class="soft-card">This demo contains no live support connection.</div></div>`;default:state.page='home';return home();}}
  function render(){renderNav();app.innerHTML=`${pageMarkup()}`;document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));bindEvents();}
  function go(page){state.page=page;history.replaceState(null,'','#'+page);window.scrollTo({top:0,behavior:'instant'});render();}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600);}
  function modal(title,body,actions=''){modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button data-close-modal aria-label="Close">×</button></div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</div></div>`;modalRoot.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click',e=>{if(e.target===el||el.classList.contains('modal-head'))modalRoot.innerHTML='';}));}
  function bindEvents(){
    document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action)));
    document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.marketFilter=el.dataset.filter;render();}));
    document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{state.mode=el.dataset.mode;render();}));
    document.querySelectorAll('[data-option-type]').forEach(el=>el.addEventListener('click',()=>{state.optionsType=el.dataset.optionType;render();}));
    document.querySelectorAll('[data-ex-side]').forEach(el=>el.addEventListener('click',()=>{state.exchangeSide=el.dataset.exSide;render();}));
    document.querySelectorAll('[data-ex-type]').forEach(el=>el.addEventListener('click',()=>{state.exchangeType=el.dataset.exType;render();}));
    document.querySelectorAll('[data-bot-tab]').forEach(el=>el.addEventListener('click',()=>{state.botTab=el.dataset.botTab;render();}));
    document.querySelectorAll('[data-add-block]').forEach(el=>el.addEventListener('click',()=>{state.botBlocks.push(el.dataset.addBlock);render();toast('Block added to workspace');}));
    document.querySelectorAll('[data-remove-block]').forEach(el=>el.addEventListener('click',()=>{state.botBlocks.splice(Number(el.dataset.removeBlock),1);render();}));
    const amt=document.getElementById('optionStake');if(amt)amt.addEventListener('input',()=>{const n=Math.max(0,Number(amt.value)||0);const p=document.getElementById('potentialPayout');if(p)p.textContent=(n*1.95).toFixed(2)+' USD';});
    const tabs=document.getElementById('highlights');
    if(tabs){document.querySelector('[data-action="highlight-left"]')?.addEventListener('click',()=>tabs.scrollBy({left:-330,behavior:'smooth'}));document.querySelector('[data-action="highlight-right"]')?.addEventListener('click',()=>tabs.scrollBy({left:330,behavior:'smooth'}));}
    const blockSearch=document.getElementById('blockSearch');if(blockSearch)blockSearch.addEventListener('input',()=>{const q=blockSearch.value.toLowerCase();document.querySelectorAll('[data-add-block]').forEach(b=>b.style.display=b.dataset.addBlock.toLowerCase().includes(q)?'block':'none');});
    const stack=document.getElementById('blockStack');if(stack){stack.querySelectorAll('[draggable="true"]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.blockIndex);});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();const from=Number(e.dataTransfer.getData('text/plain')),to=Number(el.dataset.blockIndex);if(Number.isInteger(from)&&from!==to){const b=state.botBlocks.splice(from,1)[0];state.botBlocks.splice(to,0,b);render();}});});}
  }
  function action(a){
    if(a==='deposit'){modal('Deposit funds',`<p>Choose a payment method to preview the cashier flow.</p><div class="account-list"><div class="portfolio-account"><span class="activity-dot">M</span><div class="grow"><strong>Mobile Money</strong><small>M-Pesa and supported local methods</small></div>${ico('chevron')}</div><div class="portfolio-account"><span class="activity-dot">V</span><div class="grow"><strong>Bank card</strong><small>Visa or Mastercard</small></div>${ico('chevron')}</div><div class="portfolio-account"><span class="activity-dot">P</span><div class="grow"><strong>Deriv P2P</strong><small>Peer-to-peer payment</small></div>${ico('chevron')}</div></div><p class="notice">This is a non-functional cashier preview. No payment will be collected.</p>`,`<button class="btn ghost" data-close-modal>Cancel</button><button class="btn" data-demo-action="deposit-next">Continue</button>`);modalRoot.querySelector('[data-demo-action]')?.addEventListener('click',()=>{modalRoot.innerHTML='';toast('Cashier preview only. Payments are disabled.');});}
    else if(a==='withdraw'||a==='transfer')modal(a==='withdraw'?'Withdraw funds':'Transfer funds',`<p>${a==='withdraw'?'Choose a destination and amount for a withdrawal preview.':'Choose source and destination accounts for a transfer preview.'}</p><label class="field-label">Amount (USD)</label><input class="field" type="number" placeholder="0.00"/><p class="notice">No money can be moved from this demo.</p>`,`<button class="btn ghost" data-close-modal>Cancel</button><button class="btn" data-demo-action="preview">Preview</button>`);
    else if(a==='search'||a==='market-search')modal('Search Deriv',`<div class="search-field">${ico('search')}<input id="globalSearch" placeholder="Search markets, platforms or help" autofocus></div><div id="searchResults" class="market-list" style="margin-top:12px">${markets.slice(0,4).map(m=>`<div class="market-row"><div class="market-symbol"><span class="coin-icon">${m[2]}</span><div><strong>${m[0]}</strong><small>${m[1]}</small></div></div><span></span><button class="pill" data-search-market="${m[0]}">Open</button></div>`).join('')}</div>`); 
    else if(a==='amy')modal('Ask Amy',`<p>Hi! I can help explain the demo interface, trading terms and available sections.</p><div class="search-field"><input id="amyQuestion" placeholder="Ask a question..."><button class="btn" id="amySend" style="padding:9px 12px">Send</button></div><p class="notice">AI responses are not connected in this visual demo.</p>`);
    else if(a==='notifications')modal('Notifications',`<div class="activity-row"><span class="activity-dot">✓</span><div class="grow"><strong>Welcome to your demo workspace</strong><small>This is a local interface preview</small></div></div><div class="activity-row"><span class="activity-dot">i</span><div class="grow"><strong>Profile reminders</strong><small>Account verification is not available here</small></div></div>`);
    else if(a==='profile')modal('Profile',`<div class="portfolio-account"><button class="avatar">MW</button><div class="grow"><strong>Demo trader</strong><small>Local demo profile</small></div></div><div class="activity-row"><div class="grow"><strong>Personal details</strong><small>Not connected</small></div>${ico('chevron')}</div><div class="activity-row"><div class="grow"><strong>Security settings</strong><small>Not connected</small></div>${ico('chevron')}</div>`);
    else if(a==='balance')toast('Balances are shown in demo mode.');
    else if(a==='dismiss-promo'){document.querySelector('.promo-card')?.remove();}
    else if(a==='help')toast('Help centre preview opened from More.');
    else if(a==='open-tradingview'||a==='open-mt5')toast('This platform connection is not enabled in the demo.');
    else if(a==='all-transactions')toast('No demo transactions yet.');
    else if(a==='pair-picker')modal('Select market',`<div class="market-list">${['BTC/USD','ETH/USD','SOL/USD','XRP/USD','LTC/USD'].map(p=>`<div class="activity-row"><div class="grow"><strong>${p}</strong><small>Spot market</small></div><button class="pill" data-select-pair="${p}">Select</button></div>`).join('')}</div>`);
    else if(a==='asset-picker')modal('Select underlying',`<div class="market-list">${markets.filter(x=>x[1]==='Derived'||x[1]==='Forex').slice(0,7).map(m=>`<div class="activity-row"><div class="grow"><strong>${m[0]}</strong><small>${m[1]}</small></div><button class="pill" data-select-asset="${m[0]}">Select</button></div>`).join('')}</div>`);
    else if(a==='option-rise'||a==='option-fall'){const stake=Number(document.getElementById('optionStake')?.value||state.optionStake);const dur=document.getElementById('optionDuration')?.value||state.optionDuration;const unit=document.getElementById('optionUnit')?.value||state.optionUnit;if(!stake||stake<=0){toast('Enter a valid stake amount.');return;}const side=a==='option-rise'?'Rise':'Fall';state.positions.unshift({side,asset:state.optionAsset,stake,duration:dur+' '+unit,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});render();toast(`${side} contract added to local demo positions. No live trade sent.`);}
    else if(a==='exchange-order'){const amount=Number(document.getElementById('exchangeAmount')?.value||0);if(amount<=0){toast('Enter a valid order amount.');return;}state.orders.unshift({side:state.exchangeSide,pair:state.exchangePair,type:document.getElementById('exchangeOrderType')?.value||state.exchangeType,amount:amount.toFixed(2),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});render();toast('Demo order recorded locally. Nothing was sent to an exchange.');}
    else if(a==='bot-run'){state.botRunning=!state.botRunning;render();toast(state.botRunning?'Local strategy simulation started.':'Simulation stopped.');}
    else if(a==='bot-reset'){state.botRunning=false;state.botBlocks=['Trade parameters','Purchase conditions','Sell conditions','Restart trading conditions'];render();toast('Workspace reset.');}
    else if(a==='bot-quick'){state.botBlocks=['Trade parameters','Purchase conditions','Restart trading conditions'];state.botTab='Workspace';render();toast('Quick strategy loaded.');}
    else if(a==='bot-save'){localStorage.setItem('deriv-demo-bot-blocks',JSON.stringify(state.botBlocks));toast('Strategy saved on this device.');}
    else if(a==='bot-load'){try{const saved=JSON.parse(localStorage.getItem('deriv-demo-bot-blocks')||'null');if(saved&&Array.isArray(saved)){state.botBlocks=saved;render();toast('Saved strategy loaded.');}else toast('No saved strategy found on this device.');}catch{toast('Could not load saved strategy.');}}
    else if(a==='bot-export'){const xml=`<xml>${state.botBlocks.map((b,i)=>`<block type="${b.toLowerCase().replaceAll(' ','_')}" id="${i+1}"></block>`).join('')}</xml>`;const url=URL.createObjectURL(new Blob([xml],{type:'text/xml'}));const link=document.createElement('a');link.href=url;link.download='deriv-demo-strategy.xml';link.click();URL.revokeObjectURL(url);toast('Strategy XML exported.');}
  }
  // Modal actions that use data attributes.
  modalRoot.addEventListener('click',e=>{const p=e.target.closest('[data-select-pair]');if(p){state.exchangePair=p.dataset.selectPair;modalRoot.innerHTML='';render();}const a=e.target.closest('[data-select-asset]');if(a){state.optionAsset=a.dataset.selectAsset;modalRoot.innerHTML='';render();}});
  modalRoot.addEventListener('input',e=>{if(e.target.id==='globalSearch'){const q=e.target.value.toLowerCase();const r=document.getElementById('searchResults');if(r)r.innerHTML=markets.filter(m=>m[0].toLowerCase().includes(q)||m[1].toLowerCase().includes(q)).slice(0,8).map(m=>`<div class="market-row"><div class="market-symbol"><span class="coin-icon">${m[2]}</span><div><strong>${m[0]}</strong><small>${m[1]}</small></div></div><span></span><button class="pill" data-search-market="${m[0]}">Open</button></div>`).join('')||'<p class="muted small">No matches</p>';}});
  modalRoot.addEventListener('click',e=>{const m=e.target.closest('[data-search-market]');if(m){modalRoot.innerHTML='';const market=markets.find(x=>x[0]===m.dataset.searchMarket);if(market){state.optionAsset=market[0];go(market[1]==='Crypto'?'exchange':market[1]==='Derived'||market[1]==='Forex'?'options':'cfds');}}});
  modalRoot.addEventListener('click',e=>{if(e.target.id==='amySend'){const input=document.getElementById('amyQuestion');const q=input?.value?.trim();modalRoot.innerHTML='';toast(q?'Amy demo: this assistant is not connected yet.':'Ask Amy a question first.');}});
  render();
})();
</script>
</body>
</html>
