function options(){return header('Options','Choose a contract and define your risk')+'<div class="tabs">'+['Rise/Fall','Higher/Lower','Touch/No Touch','Digits'].map(x=>'<button class="tab '+(optType===x?'active':'')+'" data-opt="'+x+'">'+x+'</button>').join('')+'</div>'+chart(asset,'17,492.36','+0.42% · Demo feed')+'<div class="panel"><b>Set your order</b><div class="grid2"><label class="fieldLabel">Duration<input class="field" id="duration" value="5"></label><label class="fieldLabel">Unit<select class="field" id="unit"><option>Minutes</option><option>Ticks</option><option>Hours</option></select></label><label class="fieldLabel">Stake (USD)<input class="field" id="stake" type="number" value="'+stake+'" min="1"></label><label class="fieldLabel">Potential payout<div class="field" id="payout">'+(stake*1.95).toFixed(2)+' USD</div></label></div><div class="tradeBtns"><button class="btn green" data-contract="Rise">↗ Rise</button><button class="btn" data-contract="Fall">↘ Fall</button></div><p class="notice">Simulated ticket only. No real contract is purchased.</p></div><div class="pad"><div class="head"><h2 class="title" style="font-size:20px">Open positions</h2><span class="eyebrow">'+positions.length+'</span></div>'+(positions.length?positions.map(p=>'<div class="portfolioRow"><div class="grow"><b>'+p.side+' · '+p.asset+'</b><small>'+p.duration+'</small></div><b>'+p.stake.toFixed(2)+' USD</b></div>').join(''):'<div class="soft muted">No open demo positions.</div>')+'</div>';}
function portfolio(){return header('Portfolio','Balances, accounts and transactions')+'<div class="pad"><div class="soft"><span class="eyebrow">Total assets · '+mode+'</span><h2 style="font-size:31px;margin:10px 0">0.00 <small class="muted">USD</small></h2><button class="btn" data-act="deposit">Deposit</button> <button class="btn ghost" data-act="withdraw">Withdraw</button> <button class="btn ghost" data-act="transfer">Transfer</button></div><div class="head"><h2 class="title" style="font-size:20px">Trading accounts</h2><button class="tab" data-act="mode">'+mode+' ⌄</button></div><div class="portfolioRow">'+logo()+'<div class="grow"><b>Options</b><small>USD · '+mode+' account</small></div><b>0.00 USD</b></div><div class="portfolioRow">'+logo('tv')+'<div class="grow"><b>TradingView</b><small>CFDs · '+mode+' account</small></div><b>0.00 USD</b></div><div class="portfolioRow">'+logo('exchange')+'<div class="grow"><b>Deriv Exchange</b><small>Crypto · '+mode+' account</small></div><b>0.00 USD</b></div><div class="head"><h2 class="title" style="font-size:20px">Recent transactions</h2></div><div class="soft muted">No transactions yet.</div></div>';}
function bot(){return '<div class="bot"><div class="botbar"><b style="padding:8px">▣ deriv Bot</b><button data-act="botquick">Quick strategy</button><button data-act="botsave">Save</button><button data-act="botload">Open</button><button data-act="botexport">Export XML</button><button class="run" data-act="botrun">'+(running?'Stop':'Run')+'</button></div><div class="pad"><b>Bot builder</b><p class="muted" style="font-size:11px">Build a strategy with connected blocks · Local demo</p></div><div class="botlayout"><aside class="blocks"><h4>Blocks menu</h4>'+['Trade parameters','Purchase conditions','Sell conditions','Restart conditions','Read market price','Compare values','Set variable'].map(x=>'<button data-block="'+x+'">+ '+x+'</button>').join('')+'</aside><section class="workspace"><strong>Workspace</strong><div id="stack">'+blocks.map((x,i)=>'<div class="block"><b>'+x+'</b>'+(i===0?'Market: Volatility 100 Index<br>Trade type: Rise/Fall<br>Duration: 5 minutes<br>Stake: 1 USD':i===1?'Purchase Rise when condition is met':i===2?'Sell contract when available':'Trade again when contract closes')+'</div>').join('')+'</div></section></div><div class="botStatus">'+(running?'Bot simulation running':'Bot is not running')+' · 0 trades · 0.00 USD</div><div class="pad muted" style="font-size:11px">Visual Blockly-inspired workspace. Strategies save locally and only run a simulation. No live API is connected.</div></div>';}
function more(){return header('More','Products and account services')+'<div class="pad"><div class="explore">'+[['Exchange','exchange'],['Options','options'],['TradingView','cfds'],['Swap-Free','cfds'],['P2P','more'],['Deriv Bot','bot'],['Deriv Trader','options'],['Deriv MT5','cfds'],['Cashier','portfolio'],['Help centre','more'],['Settings','more']].map(([n,p])=>'<button data-page="'+p+'"><span class="bubble">'+n.slice(0,2)+'</span>'+n+'</button>').join('')+'</div><div class="soft" style="margin-top:25px">Demo workspace. No Deriv account or payment processing is connected.</div></div>';}
function render(){nav();app.innerHTML='<div class="page">'+({home,cfds,exchange,options,portfolio,bot,more}[page]||home)()+'</div>';bind();}
function go(p){page=p;history.replaceState(null,'','#'+p);window.scrollTo(0,0);render();}
function say(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2300);}
function show(title,body){modal.innerHTML='<div class="modalbg" data-close><div class="modal"><h3>'+title+'</h3>'+body+'<button class="btn ghost" data-close>Close</button></div></div>';modal.querySelectorAll('[data-close]').forEach(x=>x.onclick=e=>{if(e.target===x)modal.innerHTML='';});}
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(x.dataset.page));document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()});document.querySelectorAll('[data-side]').forEach(x=>x.onclick=()=>{side=x.dataset.side;render()});document.querySelectorAll('[data-opt]').forEach(x=>x.onclick=()=>{optType=x.dataset.opt;render()});document.querySelectorAll('[data-contract]').forEach(x=>x.onclick=()=>{let s=Number($('#stake').value),d=$('#duration').value+' '+$('#unit').value;if(!s||s<=0)return say('Enter a valid stake.');positions.unshift({side:x.dataset.contract,asset,stake:s,duration:d});render();say('Demo contract recorded locally.');});document.querySelectorAll('[data-block]').forEach(x=>x.onclick=()=>{blocks.push(x.dataset.block);render();say('Block added.');});document.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>act(x.dataset.act));let st=$('#stake');if(st)st.oninput=()=>$('#payout').textContent=(Math.max(0,Number(st.value)||0)*1.95).toFixed(2)+' USD';}
function act(a){if(a==='deposit')show('Deposit funds','<p>Choose a payment method to preview the cashier flow.</p><div class="portfolioRow"><b>Mobile Money</b><span class="muted">M-Pesa</span></div><div class="portfolioRow"><b>Bank card</b><span class="muted">Visa / Mastercard</span></div><p class="notice">Payments are disabled in this demo. No money will be collected.</p>');else if(a==='withdraw'||a==='transfer')show(a==='withdraw'?'Withdraw funds':'Transfer funds','<p>This cashier action is disabled in the demo. No money can be moved.</p>');else if(a==='mode'){mode=mode==='Demo'?'Real':'Demo';render()}else if(a==='order'){let n=Number($('#amount').value);if(n<=0)return say('Enter a valid amount.');orders.unshift({side,pair,amount:n.toFixed(2),time:new Date().toLocaleTimeString()});render();say('Demo order stored locally.');}else if(a==='botrun'){running=!running;render()}else if(a==='botquick'){blocks=['Trade parameters','Purchase conditions','Restart conditions'];render()}else if(a==='botsave'){localStorage.setItem('deriv-bot-blocks',JSON.stringify(blocks));say('Strategy saved on this device.')}else if(a==='botload'){blocks=JSON.parse(localStorage.getItem('deriv-bot-blocks')||'null')||blocks;render()}else if(a==='botexport'){let b=new Blob(['<xml>'+blocks.map(x=>'<block type="'+x.toLowerCase().replaceAll(' ','_')+'"></block>').join('')+'</xml>'],{type:'text/xml'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='deriv-demo-strategy.xml';l.click();URL.revokeObjectURL(u)}else if(a==='dismiss')$('.promo')?.remove();else if(a==='search')show('Search Deriv','<input class="field" id="search" placeholder="Search markets"><div id="results"></div>');else if(a==='amy')show('Ask Amy','<p>Ask Amy can explain this demo interface. AI is not connected in this preview.</p><input class="field" placeholder="Ask a question">');else if(a==='notifications')show('Notifications','<p>Welcome to your local demo workspace.</p>');else if(a==='profile')show('Profile','<p>Demo trader · Local profile</p>');else if(a==='balance')say('Balances are shown in demo mode.');else if(a==='tradingview'||a==='mt5')say('External platform connection is not enabled.');}
modal.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();$('#results').innerHTML=m.filter(x=>x[0].toLowerCase().includes(q)).map(x=>'<p>'+x[0]+'</p>').join('')}});
render();
</script></body></html>
